[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lesvi"
description = "Single-port local library for agent-generated lessons and reference notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ashish Pothal", email = "ashishpothal@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]
dependencies = [
    "tomlkit>=0.13",
]

[project.scripts]
lesvi = "lesvi.cli:main"

[project.urls]
Repository = "https://github.com/arthishaxom/lesvi"

[project.optional-dependencies]
watch = [
    "watchfiles>=0.21",
]

[dependency-groups]
dev = [
 "basedpyright>=1.40.1",
 "pytest>=8",
 "ruff>=0.16",
 "watchfiles>=0.21",
]

[tool.hatch.version]
path = "src/lesvi/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".agents", "AGENTS.md", "skills-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.11"
include = ["src", "tests"]
# JSON payloads and tomlkit's dynamic tables are intentionally Any at the
# boundary; the Any/unknown family adds noise there without finding bugs.
reportAny = false
reportExplicitAny = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
# Style rules that fight the existing code: argparse builder calls return
# unused Actions, long messages are built from adjacent string literals, and
# `@override` needs typing_extensions on Python 3.11.
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
reportImplicitOverride = false
